<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Real-Time Parking Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <div class="login-card">
    <div class="login-side">
      <div class="logo">P</div>
      <h1>Real-Time Parking Management System</h1>
      <p>Direct every vehicle to the right parking area and see available space as it happens.</p>
      <ul>
        <li>Automatic vehicle categorization</li>
        <li>Slot assignment by type / size</li>
        <li>Live availability updates</li>
      </ul>
    </div>

    <form class="login-form" action="dashboard.html">
      <h2>Welcome back</h2>
      <p>Sign in to manage parking operations.</p>
      <label class="field">👤 Username <input placeholder="Enter your username" required></label>
      <label class="field">🔒 Password <input type="password" placeholder="Enter your password" required></label>
      <label class="field">Role
        <select><option>Parking Attendant</option><option>Administrator</option></select>
      </label>
      <div class="remember">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block">Log In</button>
    </form>
  </div>
</body>
</html>
